[package]
name = "jilo-studio"
description = "Jilo Studio desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "jilo-studio"
build = "build.rs"

[lints]
workspace = true

[features]
default = ["neural-voices"]
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["jilo-engine/whisper", "jilo-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M on the CPU, downloaded on first use).
neural-voices = ["jilo-engine/neural-voices"]

[dependencies]
jilo-engine = { workspace = true }
jilo-export = { workspace = true }
jilo-project = { workspace = true }
jilo-render = { workspace = true }
jilo-time = { workspace = true }
jilo-gpu = { workspace = true }
jilo-ui-egui = { workspace = true }
jilo-platform = { workspace = true }
# `--mcp`: the MCP server AI assistants run (Settings ▸ AI ▸ Connect an Assistant)
jilo-automation = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
cpal = "0.16"
# Files and images on the system clipboard for Paste (#611); egui already uses it for text.
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"

[dev-dependencies]
glob = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Our macOS build transcribes (Text panel ▸ Transcribe) and speaks natural voices on the GPU
# (Metal), with Accelerate for what stays on the CPU.
jilo-engine = { workspace = true, features = ["whisper", "speech-download", "neural-voices", "apple-ml", "ai-net"] }
muda = "0.21"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2 = "0.6"
# Same winit as eframe: macOS event-loop options (no app activation when driven by an agent).
winit = { version = "0.30", default-features = false }

# Windows: Whisper and Kokoro on the CPU, cloud AI (Gemini, OpenAI, Claude, ElevenLabs) and model
# downloads, as on the Mac but without Metal / Accelerate.
[target.'cfg(target_os = "windows")'.dependencies]
jilo-engine = { workspace = true, features = ["whisper", "speech-download", "neural-voices", "ai-net"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with system: the XDG desktop portal's colour scheme. The zbus the
# portal file dialogs (rfd) and accesskit already use.
zbus = "5.19"

# Icon + VERSIONINFO for jilo-studio.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
