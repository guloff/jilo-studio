<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="660" height="400" viewBox="0 0 660 400">
<!-- Jilo Studio DMG window: a black panel with the app icon's J and track as a cover on the left, paper under
     both icons (Finder draws their labels in black), an editing-track arrow from the app to
     Applications. No text, so rendering needs no fonts. -->
<defs><clipPath id="panel"><rect width="232" height="400"/></clipPath></defs>

<rect width="660" height="400" fill="#f4f4ef"/>
<g clip-path="url(#panel)"><rect width="232" height="400" fill="#0a0a0a"/><g transform="translate(-74.0,-12.0) scale(0.42)">
  <!-- the Jilo Studio icon's J and editing track (assets/brand/jilo/jilo-studio.svg), without its plate -->
  <path d="M 612 226 L 612 500 A 150 150 0 0 1 312 500" fill="none" stroke="#c8ff00" stroke-width="92" stroke-linecap="round"/>
  <rect x="236" y="758" width="250" height="58" rx="18" fill="#c8ff00"/>
  <rect x="506" y="758" width="130" height="58" rx="18" fill="#c8ff00" fill-opacity="0.45"/>
  <rect x="656" y="758" width="132" height="58" rx="18" fill="#c8ff00" fill-opacity="0.2"/>
  <rect x="495" y="738" width="6" height="98" rx="3" fill="#ffffff"/>
</g></g>
<line x1="232.5" y1="0" x2="232.5" y2="400" stroke="#0a0a0a" stroke-width="1.2"/>
<line x1="236.5" y1="0" x2="236.5" y2="400" stroke="#0a0a0a" stroke-width="0.5"/>

<line x1="267" y1="88.5" x2="624" y2="88.5" stroke="#0a0a0a" stroke-width="0.6"/>
<rect x="267" y="84" width="22" height="9" rx="3" fill="#c8ff00" stroke="#0a0a0a" stroke-width="0.8"/>

<rect x="404" y="199" width="22" height="12" rx="3.5" fill="#0a0a0a"/>
<rect x="430" y="199" width="12" height="12" rx="3.5" fill="#0a0a0a" fill-opacity="0.55"/>
<rect x="446" y="199" width="12" height="12" rx="3.5" fill="#0a0a0a" fill-opacity="0.25"/>
<rect x="427.2" y="194" width="1.6" height="22" rx="0.8" fill="#0a0a0a"/>
<path d="M466,192 L490,205 L466,218 Z" fill="#c8ff00" stroke="#0a0a0a" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="267" y1="335.5" x2="624" y2="335.5" stroke="#0a0a0a" stroke-width="0.6"/>
</svg>
