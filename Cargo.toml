[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# vendor/: patched third-party crates (see [patch.crates-io]), not workspace members
exclude = ["vendor"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/guloff/jilo-studio"

[workspace.dependencies]
# internal
jilo-time = { path = "crates/time" }
jilo-geom = { path = "crates/geom" }
jilo-color = { path = "crates/color" }
jilo-bitstream = { path = "crates/bitstream" }
jilo-isobmff = { path = "crates/isobmff" }
jilo-matroska = { path = "crates/matroska" }
jilo-mxf = { path = "crates/mxf" }
jilo-cfb = { path = "crates/cfb" }
jilo-mpegts = { path = "crates/mpegts" }
jilo-mpeg2v = { path = "crates/mpeg2v" }
jilo-ac3 = { path = "crates/ac3" }
jilo-ogg = { path = "crates/ogg" }
jilo-h264 = { path = "crates/h264" }
jilo-hevc = { path = "crates/hevc" }
jilo-vp9 = { path = "crates/vp9" }
jilo-prores = { path = "crates/prores" }
jilo-dnx = { path = "crates/dnx" }
jilo-apv = { path = "crates/apv" }
jilo-av1 = { path = "crates/av1" }
jilo-aac = { path = "crates/aac" }
jilo-flac = { path = "crates/flac" }
jilo-opus = { path = "crates/opus" }
jilo-h264enc = { path = "crates/h264enc" }
jilo-audio-dsp = { path = "crates/audio-dsp" }
jilo-frame = { path = "crates/frame" }
jilo-media = { path = "crates/media" }
jilo-codecs = { path = "crates/codecs" }
jilo-project = { path = "crates/project" }
jilo-edit = { path = "crates/edit" }
jilo-interchange = { path = "crates/interchange" }
jilo-text = { path = "crates/text" }
jilo-captions = { path = "crates/captions" }
jilo-speech = { path = "crates/speech" }
jilo-tts = { path = "crates/tts" }
jilo-tts-text = { path = "crates/tts-text" }
jilo-ai = { path = "crates/ai" }
jilo-render = { path = "crates/render" }
jilo-gpu = { path = "crates/gpu" }
jilo-scopes = { path = "crates/scopes" }
jilo-export = { path = "crates/export" }
jilo-format = { path = "crates/format" }
jilo-engine = { path = "crates/engine" }
jilo-ui-egui = { path = "crates/ui-egui" }
jilo-automation = { path = "crates/automation" }
jilo-platform = { path = "crates/platform" }
jilo-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
rayon = "1"
proptest = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
roxmltree = "0.21"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.jilo-h264]
opt-level = 3

[profile.dev.package.jilo-h264enc]
opt-level = 3

[profile.dev.package.jilo-hevc]
opt-level = 3

[profile.dev.package.jilo-prores]
opt-level = 3

[profile.dev.package.jilo-dnx]
opt-level = 3

[profile.dev.package.jilo-apv]
opt-level = 3

[profile.dev.package.jilo-av1]
opt-level = 3

[profile.dev.package.jilo-aac]
opt-level = 3

[profile.dev.package.jilo-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.jilo-audio-dsp]
opt-level = 3

[profile.dev.package.jilo-mxf]
opt-level = 3

[profile.dev.package.jilo-opus]
opt-level = 3

[profile.dev.package.jilo-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# egui-wgpu 0.36.2 with a surface format / colour-space option (EDR HDR monitors on macOS) and
# half-float screen capture; vendor/egui-wgpu/PATCH.md lists the changes.
[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }
