[package]
name = "jilo-ui-egui"
description = "The Jilo Studio egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
jilo-time = { workspace = true }
jilo-geom = { workspace = true }
jilo-color = { workspace = true }
jilo-frame = { workspace = true }
jilo-media = { workspace = true }
jilo-project = { workspace = true }
jilo-captions = { workspace = true }
jilo-tts = { workspace = true }
jilo-edit = { workspace = true }
jilo-render = { workspace = true }
jilo-text = { workspace = true }
jilo-audio-dsp = { workspace = true }
jilo-engine = { workspace = true }
jilo-ai = { workspace = true }
jilo-export = { workspace = true }
jilo-gpu = { workspace = true }
jilo-scopes = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# The Jilo Studio mark (PNG) for the About dialog and Home screen.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "0.4"
jilo-codecs = { workspace = true }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
jilo-platform = { workspace = true }
jilo-interchange = { workspace = true }
jilo-speech = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
sha2 = "0.10"

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
serde_json = { workspace = true }
toml = "1"
