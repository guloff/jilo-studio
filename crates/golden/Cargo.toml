[package]
name = "jilo-golden"
description = "Golden-image tests for the CPU renderer/compositor and GPU-vs-CPU parity (test-only crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Test-only: the library is empty and everything is a dev-dependency, so the crate adds no edges
# to the layer graph. Goldens live in `goldens/` (see docs/testing.md §3).
[dependencies]

[dev-dependencies]
jilo-testkit = { workspace = true }
jilo-color = { workspace = true }
jilo-frame = { workspace = true }
jilo-time = { workspace = true }
jilo-geom = { workspace = true }
jilo-media = { workspace = true }
jilo-project = { workspace = true }
jilo-render = { workspace = true }
jilo-gpu = { workspace = true }
pollster = "0.4"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
