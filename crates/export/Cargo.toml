jilo-text = { workspace = true }
jilo-isobmff = { workspace = true }
jilo-prores = { workspace = true }
jilo-dnx = { workspace = true }
jilo-apv = { workspace = true }
jilo-mxf = { workspace = true }
jilo-aac = { workspace = true }
jilo-flac = { workspace = true }
jilo-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
