[package]
name = "jilo-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
jilo-time = { workspace = true }
jilo-color = { workspace = true }
jilo-frame = { workspace = true }
jilo-media = { workspace = true }
jilo-isobmff = { workspace = true }
jilo-matroska = { workspace = true }
jilo-mxf = { workspace = true }
jilo-mpegts = { workspace = true }
jilo-mpeg2v = { workspace = true }
jilo-ac3 = { workspace = true }
jilo-ogg = { workspace = true }
jilo-bitstream = { workspace = true }
jilo-h264 = { workspace = true }
jilo-hevc = { workspace = true }
jilo-vp9 = { workspace = true }
jilo-prores = { workspace = true }
jilo-dnx = { workspace = true }
jilo-av1 = { workspace = true }
jilo-apv = { workspace = true }
jilo-aac = { workspace = true }
jilo-opus = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
jilo-testkit = { workspace = true }
serde_json = { workspace = true }
