[package]
name = "jilo-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
jilo-color = { workspace = true }
jilo-frame = { workspace = true }
jilo-geom = { workspace = true }
jilo-project = { workspace = true }
jilo-render = { workspace = true }
jilo-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "0.4"
rayon = { workspace = true }

[dev-dependencies]
pollster = "0.4"
jilo-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
jilo-media = { workspace = true }
jilo-time = { workspace = true }
