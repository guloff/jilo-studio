[package]
name = "jilo-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
jilo-time = { workspace = true }
jilo-geom = { workspace = true }
jilo-color = { workspace = true }
jilo-frame = { workspace = true }
jilo-media = { workspace = true }
jilo-project = { workspace = true }
jilo-audio-dsp = { workspace = true }
jilo-captions = { workspace = true }
jilo-text = { workspace = true }
rayon = { workspace = true }
# EDR monitor frames are half-float RGBA (`colorman::to_edr`).
half = { version = "2", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
